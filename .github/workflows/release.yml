name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build-apk:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: set up JDK 18
        uses: actions/setup-java@v4
        with:
          java-version: 18
          distribution: temurin

      - name: Install npm dependencies
        run: |
          npm install && npx expo prebuild --platform android
      - name: Build Android Release
        run: |
          cd android && ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/casdoor-authenticator.apk
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: casdoor-authenticator.apk
          path: android/app/build/outputs/apk/release/

  semantic-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Releases take ~15 min to build the APK; queue them so a later push
    # sees the previous tag instead of computing the same version again
    concurrency:
      group: semantic-release
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: set up JDK 18
        uses: actions/setup-java@v4
        with:
          java-version: 18
          distribution: temurin

      - name: Install npm dependencies
        run: npm install

      # semantic-release-expo writes the release version into app.json, then
      # @semantic-release/exec builds the APK, which is uploaded to the GitHub release
      - name: Run semantic-release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
