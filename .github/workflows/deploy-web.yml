name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Export web app
        run: npm run export:web -- --output-dir dist

      - name: Fix paths for GitHub Pages subdirectory
        run: |
          # Extract repository name from GITHUB_REPOSITORY (format: owner/repo)
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          
          # Fix absolute paths in index.html to include the repository name prefix
          if [ ! -f dist/index.html ]; then
            echo "Error: dist/index.html not found"
            exit 1
          fi
          
          # Apply path fixes
          sed -i "s|href=\"/favicon.ico\"|href=\"/${REPO_NAME}/favicon.ico\"|g" dist/index.html
          sed -i "s|src=\"/_expo/|src=\"/${REPO_NAME}/_expo/|g" dist/index.html
          
          # Verify that at least one of the expected patterns was updated
          # (Expo-generated index.html should have both, but this is more resilient)
          if ! grep -q "/${REPO_NAME}/" dist/index.html; then
            echo "Error: No paths were updated in index.html"
            cat dist/index.html
            exit 1
          fi
          
          echo "Successfully updated paths for GitHub Pages deployment to /${REPO_NAME}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
